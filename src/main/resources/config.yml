starting-balance: 100.00
currency:
  singular: coin
  plural: coins
  symbol: '$'
  symbol-before-amount: true
save-interval-seconds: 300
transaction-history-limit: 500
auction:
  duration-hours: 48
  maximum-active-listings: 10
  minimum-price: 1.00
  maximum-price: 1000000000.00
marketplace:
  transaction-fee-rate: 0.035
statistics:
  growth-thresholds:
    stable-max: 3.0
    moderate-max: 7.0
    high-risk-max: 12.0
sell:
  enabled: true
  materials:
    ECHO_SHARD: {enabled: true, base-price: 300, minimum-price: 15, reference-quantity: 8, drop-rate: 0.10, recovery-half-life-hours: 24}
    DIAMOND: {enabled: true, base-price: 150, minimum-price: 7.50, reference-quantity: 32, drop-rate: 0.05, recovery-half-life-hours: 12}
    ANCIENT_DEBRIS: {enabled: true, base-price: 180, minimum-price: 9, reference-quantity: 16, drop-rate: 0.08, recovery-half-life-hours: 18}
    NETHERITE_SCRAP: {enabled: true, base-price: 200, minimum-price: 10, reference-quantity: 16, drop-rate: 0.08, recovery-half-life-hours: 18}
    NETHERITE_INGOT: {enabled: true, base-price: 820, minimum-price: 41, reference-quantity: 4, drop-rate: 0.10, recovery-half-life-hours: 24}
    DRAGON_HEAD: {enabled: true, base-price: 1200, minimum-price: 60, reference-quantity: 1, drop-rate: 0.15, recovery-half-life-hours: 48}
    HEAVY_CORE: {enabled: true, base-price: 800, minimum-price: 40, reference-quantity: 2, drop-rate: 0.12, recovery-half-life-hours: 36}
    TRIAL_KEY: {enabled: true, base-price: 30, minimum-price: 1.50, reference-quantity: 16, drop-rate: 0.10, recovery-half-life-hours: 8}
