    TROPICAL_FISH: {enabled: true, base-price: 2.50, minimum-price: 0, reference-quantity: 32, drop-rate: 0.10, recovery-half-life-hours: 3}
bounty:
  minimum-amount: 100.00
  placement-cooldown-seconds: 60
  protect-server-operators: true
orders:
  maximum-active-orders: 10
  expiry-days: 7
  minimum-price-per-item: 1.00
  maximum-quantity: 2304
  # When enabled, every valid Minecraft item is available, including items added
  # by future server updates. Set this to false to use allowed-materials instead.
  include-all-materials: true
  excluded-materials:
    # All spawn eggs and known creative/operator-only items are also excluded
    # automatically in code, including items introduced by future updates.
    - LIGHT
    - BARRIER
    - DEBUG_STICK
    - KNOWLEDGE_BOOK
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - SPAWNER
    - BEDROCK
    - END_PORTAL_FRAME
    - REINFORCED_DEEPSLATE
    - PETRIFIED_OAK_SLAB
    - BUDDING_AMETHYST
    - SUSPICIOUS_SAND
    - SUSPICIOUS_GRAVEL
    - TRIAL_SPAWNER
    - VAULT
    - FARMLAND
    - DIRT_PATH
    - FROSTED_ICE
  allowed-materials:
    - DIAMOND
    - EMERALD
    - GOLD_INGOT
    - IRON_INGOT
    - NETHERITE_INGOT
    - COAL
    - REDSTONE
    - LAPIS_LAZULI
