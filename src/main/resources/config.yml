    COD: {enabled: true, base-price: 0.80, minimum-price: 0, reference-quantity: 64, drop-rate: 0.10, recovery-half-life-hours: 2}
    SALMON: {enabled: true, base-price: 1.20, minimum-price: 0, reference-quantity: 64, drop-rate: 0.10, recovery-half-life-hours: 2}
