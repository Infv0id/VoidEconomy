  no-permission: '&cYou do not have permission to do that.'
  players-only: '&cOnly players can use this command.'
  player-not-found: '&cThat player could not be found.'
  invalid-amount: '&cEnter a positive amount with no more than 2 decimal places.'
  insufficient-funds: '&cYou do not have enough money.'
  cannot-pay-self: '&cYou cannot pay yourself.'
